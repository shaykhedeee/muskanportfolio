  <!-- Title Block & Sheet Border -->
  <rect x="25" y="25" width="950" height="950" fill="none" stroke="#3D3A34" stroke-width="2.5" />
  <rect x="30" y="30" width="940" height="940" fill="none" stroke="#8C8275" stroke-width="0.75" />

  <!-- Sheet Title Block Header -->
  <g id="titleBlock">
    <!-- North Arrow -->
    <g transform="translate(910, 70)">
      <circle cx="0" cy="0" r="22" fill="#FAF6EE" stroke="#3D3A34" stroke-width="1.5" />
      <polygon points="0,-18 6,10 0,6" fill="#3D3A34" />
      <polygon points="0,-18 -6,10 0,6" fill="#8C8275" />
      <text x="0" y="-22" font-family="'Courier New', monospace" font-size="11" font-weight="bold" fill="#3D3A34" text-anchor="middle">N</text>
    </g>

    <!-- Project Header Text -->
    <text x="50" y="65" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="18" font-weight="bold" fill="#2C2822" letter-spacing="1.5">OLIVE & OAK · ARTISAN CAFÉ & BAKERY SPATIAL LAYOUT</text>
    <text x="50" y="85" font-family="'Courier New', monospace" font-size="10" font-weight="bold" fill="#5F6F52" letter-spacing="1">LEVEL 01 · FINISHED FLOOR PLAN · SCALE 1:50 @ A3 · DIMENSIONS IN MM</text>
    <text x="50" y="100" font-family="'Courier New', monospace" font-size="9" fill="#7A7063">DWG NO: OO-JPR-2024 · TOTAL AREA: 2,200 SQ.FT. CAFÉ · MUSKAN PAREEK INTERIORS</text>
    <line x1="50" y1="110" x2="950" y2="110" stroke="#3D3A34" stroke-width="1.2" />
  </g>

  <!-- Flooring Textures & Zones -->
  <g id="flooringZones">
    
      <rect x="380" y="340" width="320" height="240" fill="url(#tileGrid)" opacity="0.7" />
      <text x="540" y="370" font-family="'Courier New', monospace" font-size="11" font-weight="bold" fill="#3D3A34" text-anchor="middle" letter-spacing="1">COFFEE BAR & BREW STATION</text>
      <text x="540" y="384" font-family="'Courier New', monospace" font-size="8.5" fill="#6B6255" text-anchor="middle">5400 × 3200 mm</text>
    
    
      <rect x="120" y="140" width="260" height="540" fill="url(#woodFloor)" opacity="0.7" />
      <text x="250" y="180" font-family="'Courier New', monospace" font-size="11" font-weight="bold" fill="#3D3A34" text-anchor="middle" letter-spacing="1">ARCHED BANQUETTE ALCOVES</text>
      <text x="250" y="194" font-family="'Courier New', monospace" font-size="8.5" fill="#6B6255" text-anchor="middle">6400 × 2800 mm</text>
    
    
      <rect x="380" y="600" width="320" height="260" fill="url(#woodFloor)" opacity="0.7" />
      <text x="540" y="630" font-family="'Courier New', monospace" font-size="11" font-weight="bold" fill="#3D3A34" text-anchor="middle" letter-spacing="1">COMMUNAL HARVEST DINING</text>
      <text x="540" y="644" font-family="'Courier New', monospace" font-size="8.5" fill="#6B6255" text-anchor="middle">5200 × 3600 mm</text>
    
    
      <rect x="720" y="140" width="160" height="720" fill="url(#tileGrid)" opacity="0.7" />
      <text x="800" y="185" font-family="'Courier New', monospace" font-size="11" font-weight="bold" fill="#3D3A34" text-anchor="middle" letter-spacing="1">GARDEN VERANDAH LOUNGE</text>
      <text x="800" y="199" font-family="'Courier New', monospace" font-size="8.5" fill="#6B6255" text-anchor="middle">3600 × 6400 mm</text>
    
  </g>

  <!-- Structural Walls with Hatch -->
  <g id="structuralWalls" filter="url(#wallShadow)">
    
      <rect x="100" y="120" width="800" height="18" fill="#2C2822" stroke="#1F1B16" stroke-width="1.5" />
      <rect x="100" y="120" width="800" height="18" fill="url(#brickHatch)" />
    
    
      <rect x="880" y="120" width="18" height="760" fill="#2C2822" stroke="#1F1B16" stroke-width="1.5" />
      <rect x="880" y="120" width="18" height="760" fill="url(#brickHatch)" />
    
    
      <rect x="100" y="880" width="800" height="18" fill="#2C2822" stroke="#1F1B16" stroke-width="1.5" />
      <rect x="100" y="880" width="800" height="18" fill="url(#brickHatch)" />
    
    
      <rect x="100" y="120" width="18" height="760" fill="#2C2822" stroke="#1F1B16" stroke-width="1.5" />
      <rect x="100" y="120" width="18" height="760" fill="url(#brickHatch)" />
    
    
      <rect x="360" y="120" width="16" height="560" fill="#2C2822" stroke="#1F1B16" stroke-width="1.5" />
      <rect x="360" y="120" width="16" height="560" fill="url(#brickHatch)" />
    
    
      <rect x="700" y="120" width="16" height="760" fill="#2C2822" stroke="#1F1B16" stroke-width="1.5" />
      <rect x="700" y="120" width="16" height="760" fill="url(#brickHatch)" />
    
  </g>

  <!-- Door Swings & Openings -->
  <g id="doorSwings">
    
  </g>

  <!-- Architectural Furniture Blocks -->
  <g id="furnitureLayout">
    <rect x="420" y="380" width="220" height="70" rx="8" fill="#C9A77D" stroke="#3D3A34" stroke-width="2" />
    <rect x="440" y="390" width="80" height="30" rx="3" fill="#1F2022" stroke="#3D3A34" stroke-width="1.2" />
    <rect x="540" y="390" width="80" height="30" rx="2" fill="#E5E1D8" stroke="#3D3A34" stroke-width="1" />
    <path d="M 130,200 Q 200,200 200,260 L 200,320 Q 200,380 130,380" fill="#ECE6DB" stroke="#3D3A34" stroke-width="1.5" />
    <path d="M 130,420 Q 200,420 200,480 L 200,540 Q 200,600 130,600" fill="#ECE6DB" stroke="#3D3A34" stroke-width="1.5" />
    <rect x="430" y="650" width="200" height="60" rx="6" fill="#C9A77D" stroke="#3D3A34" stroke-width="1.8" />
    <circle cx="450" cy="630" r="10" fill="#ECE6DB" stroke="#3D3A34" stroke-width="1" />
    <circle cx="500" cy="630" r="10" fill="#ECE6DB" stroke="#3D3A34" stroke-width="1" />
    <circle cx="550" cy="630" r="10" fill="#ECE6DB" stroke="#3D3A34" stroke-width="1" />
    <circle cx="600" cy="630" r="10" fill="#ECE6DB" stroke="#3D3A34" stroke-width="1" />
    <circle cx="450" cy="730" r="10" fill="#ECE6DB" stroke="#3D3A34" stroke-width="1" />
    <circle cx="500" cy="730" r="10" fill="#ECE6DB" stroke="#3D3A34" stroke-width="1" />
    <circle cx="550" cy="730" r="10" fill="#ECE6DB" stroke="#3D3A34" stroke-width="1" />
    <circle cx="600" cy="730" r="10" fill="#ECE6DB" stroke="#3D3A34" stroke-width="1" />
  </g>

  <!-- Architectural Annotations & Dimension Chains -->
  <g id="annotations">
    <circle cx="520" cy="450" r="14" fill="#FFCF56" stroke="#2C2822" stroke-width="2" />
    <text x="520" y="454" font-family="'Courier New', monospace" font-size="10" font-weight="bold" fill="#2C2822" text-anchor="middle">01</text>
    <circle cx="250" cy="500" r="14" fill="#FFCF56" stroke="#2C2822" stroke-width="2" />
    <text x="250" y="504" font-family="'Courier New', monospace" font-size="10" font-weight="bold" fill="#2C2822" text-anchor="middle">02</text>
    <circle cx="500" cy="650" r="14" fill="#FFCF56" stroke="#2C2822" stroke-width="2" />
    <text x="500" y="654" font-family="'Courier New', monospace" font-size="10" font-weight="bold" fill="#2C2822" text-anchor="middle">03</text>
    <circle cx="450" cy="280" r="14" fill="#FFCF56" stroke="#2C2822" stroke-width="2" />
    <text x="450" y="284" font-family="'Courier New', monospace" font-size="10" font-weight="bold" fill="#2C2822" text-anchor="middle">04</text>
    <circle cx="750" cy="700" r="14" fill="#FFCF56" stroke="#2C2822" stroke-width="2" />
    <text x="750" y="704" font-family="'Courier New', monospace" font-size="10" font-weight="bold" fill="#2C2822" text-anchor="middle">05</text>
  </g>

  <!-- Graphic Scale Bar Bottom Right -->
  <g transform="translate(680, 935)">
    <rect x="0" y="0" width="240" height="20" fill="#FAF6EE" stroke="#3D3A34" stroke-width="1" />
    <rect x="0" y="0" width="60" height="10" fill="#3D3A34" />
    <rect x="60" y="10" width="60" height="10" fill="#3D3A34" />
    <rect x="120" y="0" width="60" height="10" fill="#3D3A34" />
    <rect x="180" y="10" width="60" height="10" fill="#3D3A34" />
    <text x="0" y="-4" font-family="'Courier New', monospace" font-size="8" fill="#3D3A34">0</text>
    <text x="60" y="-4" font-family="'Courier New', monospace" font-size="8" fill="#3D3A34">1m</text>
    <text x="120" y="-4" font-family="'Courier New', monospace" font-size="8" fill="#3D3A34">2m</text>
    <text x="180" y="-4" font-family="'Courier New', monospace" font-size="8" fill="#3D3A34">3m</text>
    <text x="240" y="-4" font-family="'Courier New', monospace" font-size="8" fill="#3D3A34">4m</text>
    <text x="120" y="28" font-family="'Courier New', monospace" font-size="8" fill="#7A7063" text-anchor="middle">METRIC GRAPHIC SCALE</text>
