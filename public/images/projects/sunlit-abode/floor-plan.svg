      <rect x="380" y="380" width="240" height="240" fill="url(#tileGrid)" opacity="0.7" />
      <text x="500" y="490" font-family="'Courier New', monospace" font-size="11" font-weight="bold" fill="#3D3A34" text-anchor="middle" letter-spacing="1">CENTRAL SUNLIT COURTYARD</text>
      <text x="500" y="504" font-family="'Courier New', monospace" font-size="8.5" fill="#6B6255" text-anchor="middle">3600 × 3600 mm</text>
    
    
      <rect x="120" y="140" width="500" height="220" fill="url(#woodFloor)" opacity="0.7" />
      <text x="370" y="170" font-family="'Courier New', monospace" font-size="11" font-weight="bold" fill="#3D3A34" text-anchor="middle" letter-spacing="1">LIVING SALON & LOUNGE</text>
      <text x="370" y="184" font-family="'Courier New', monospace" font-size="8.5" fill="#6B6255" text-anchor="middle">6200 × 4200 mm</text>
    
    
