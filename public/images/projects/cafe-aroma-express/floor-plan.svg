<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
  <defs>
    <!-- Parchment Paper Filter & Hatching Patterns -->
    <pattern id="brickHatch" width="10" height="10" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#3D3A34" stroke-width="1.2" opacity="0.3" />
    </pattern>
    <pattern id="concreteHatch" width="8" height="8" patternTransform="rotate(-45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#5A5348" stroke-width="1.0" opacity="0.25" />
    </pattern>
    <pattern id="tileGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <rect width="24" height="24" fill="none" stroke="#D3CBC0" stroke-width="0.75" />
    </pattern>
    <pattern id="woodFloor" width="60" height="12" patternUnits="userSpaceOnUse">
      <rect width="60" height="12" fill="none" stroke="#D8CFC2" stroke-width="0.6" />
      <line x1="30" y1="0" x2="30" y2="12" stroke="#D8CFC2" stroke-width="0.6" />
    </pattern>
    <!-- Drop Shadow for Structure -->
    <filter id="wallShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#2D2820" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Parchment Sheet Background -->
  <rect width="100%" height="100%" fill="#FAF6EE" />
  
  <!-- Architectural Drawing Grid (Subtle 50mm Cad Grid) -->
  <g opacity="0.15">
    <line x1="50" y1="40" x2="50" y2="960" stroke="#B8AEA2" stroke-width="0.5" stroke-dasharray="2 4" />
    <line x1="100" y1="40" x2="100" y2="960" stroke="#B8AEA2" stroke-width="0.5" stroke-dasharray="2 4" />
    <line x1="150" y1="40" x2="150" y2="960" stroke="#B8AEA2" stroke-width="0.5" stroke-dasharray="2 4" />
    <line x1="200" y1="40" x2="200" y2="960" stroke="#B8AEA2" stroke-width="0.5" stroke-dasharray="2 4" />
    <line x1="250" y1="40" x2="250" y2="960" stroke="#B8AEA2" stroke-width="0.5" stroke-dasharray="2 4" />
    <line x1="300" y1="40" x2="300" y2="960" stroke="#B8AEA2" stroke-width="0.5" stroke-dasharray="2 4" />
    <line x1="350" y1="40" x2="350" y2="960" stroke="#B8AEA2" stroke-width="0.5" stroke-dasharray="2 4" />
    <line x1="400" y1="40" x2="400" y2="960" stroke="#B8AEA2" stroke-width="0.5" stroke-dasharray="2 4" />
    <line x1="450" y1="40" x2="450" y2="960" stroke="#B8AEA2" stroke-width="0.5" stroke-dasharray="2 4" />
    <line x1="500" y1="40" x2="500" y2="960" stroke="#B8AEA2" stroke-width="0.5" stroke-dasharray="2 4" />
    <line x1="550" y1="40" x2="550" y2="960" stroke="#B8AEA2" stroke-width="0.5" stroke-dasharray="2 4" />
    <line x1="600" y1="40" x2="600" y2="960" stroke="#B8AEA2" stroke-width="0.5" stroke-dasharray="2 4" />
    <line x1="650" y1="40" x2="650" y2="960" stroke="#B8AEA2" stroke-width="0.5" stroke-dasharray="2 4" />
    <line x1="700" y1="40" x2="700" y2="960" stroke="#B8AEA2" stroke-width="0.5" stroke-dasharray="2 4" />
    <line x1="750" y1="40" x2="750" y2="960" stroke="#B8AEA2" stroke-width="0.5" stroke-dasharray="2 4" />
    <line x1="800" y1="40" x2="800" y2="960" stroke="#B8AEA2" stroke-width="0.5" stroke-dasharray="2 4" />
    <line x1="850" y1="40" x2="850" y2="960" stroke="#B8AEA2" stroke-width="0.5" stroke-dasharray="2 4" />
    <line x1="900" y1="40" x2="900" y2="960" stroke="#B8AEA2" stroke-width="0.5" stroke-dasharray="2 4" />
    <line x1="950" y1="40" x2="950" y2="960" stroke="#B8AEA2" stroke-width="0.5" stroke-dasharray="2 4" />
    <line x1="40" y1="50" x2="960" y2="50" stroke="#B8AEA2" stroke-width="0.5" stroke-dasharray="2 4" />
    <line x1="40" y1="100" x2="960" y2="100" stroke="#B8AEA2" stroke-width="0.5" stroke-dasharray="2 4" />
    <line x1="40" y1="150" x2="960" y2="150" stroke="#B8AEA2" stroke-width="0.5" stroke-dasharray="2 4" />
    <line x1="40" y1="200" x2="960" y2="200" stroke="#B8AEA2" stroke-width="0.5" stroke-dasharray="2 4" />
    <line x1="40" y1="250" x2="960" y2="250" stroke="#B8AEA2" stroke-width="0.5" stroke-dasharray="2 4" />
    <line x1="40" y1="300" x2="960" y2="300" stroke="#B8AEA2" stroke-width="0.5" stroke-dasharray="2 4" />
    <line x1="40" y1="350" x2="960" y2="350" stroke="#B8AEA2" stroke-width="0.5" stroke-dasharray="2 4" />
    <line x1="40" y1="400" x2="960" y2="400" stroke="#B8AEA2" stroke-width="0.5" stroke-dasharray="2 4" />
    <line x1="40" y1="450" x2="960" y2="450" stroke="#B8AEA2" stroke-width="0.5" stroke-dasharray="2 4" />
    <line x1="40" y1="500" x2="960" y2="500" stroke="#B8AEA2" stroke-width="0.5" stroke-dasharray="2 4" />
    <line x1="40" y1="550" x2="960" y2="550" stroke="#B8AEA2" stroke-width="0.5" stroke-dasharray="2 4" />
    <line x1="40" y1="600" x2="960" y2="600" stroke="#B8AEA2" stroke-width="0.5" stroke-dasharray="2 4" />
    <line x1="40" y1="650" x2="960" y2="650" stroke="#B8AEA2" stroke-width="0.5" stroke-dasharray="2 4" />
    <line x1="40" y1="700" x2="960" y2="700" stroke="#B8AEA2" stroke-width="0.5" stroke-dasharray="2 4" />
    <line x1="40" y1="750" x2="960" y2="750" stroke="#B8AEA2" stroke-width="0.5" stroke-dasharray="2 4" />
    <line x1="40" y1="800" x2="960" y2="800" stroke="#B8AEA2" stroke-width="0.5" stroke-dasharray="2 4" />
    <line x1="40" y1="850" x2="960" y2="850" stroke="#B8AEA2" stroke-width="0.5" stroke-dasharray="2 4" />
    <line x1="40" y1="900" x2="960" y2="900" stroke="#B8AEA2" stroke-width="0.5" stroke-dasharray="2 4" />
    <line x1="40" y1="950" x2="960" y2="950" stroke="#B8AEA2" stroke-width="0.5" stroke-dasharray="2 4" />
  </g>

  <!-- Title Block & Sheet Border -->
  <rect x="25" y="25" width="950" height="950" fill="none" stroke="#3D3A34" stroke-width="2.5" />
  <rect x="30" y="30" width="940" height="940" fill="none" stroke="#8C8275" stroke-width="0.75" />

  <!-- Sheet Title Block Header -->
  <g id="titleBlock">
    <!-- North Arrow -->
    <g transform="translate(910, 70)">
      <circle cx="0" cy="0" r="22" fill="#FAF6EE" stroke="#3D3A34" stroke-width="1.5" />
      <polygon points="0,-18 6,10 0,6" fill="#3D3A34" />
      <polygon points="0,-18 -6,10 0,6" fill="#8C8275" />
      <text x="0" y="-22" font-family="'Courier New', monospace" font-size="11" font-weight="bold" fill="#3D3A34" text-anchor="middle">N</text>
    </g>

    <!-- Project Header Text -->
    <text x="50" y="65" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="18" font-weight="bold" fill="#2C2822" letter-spacing="1.5">CAFÉ AROMA EXPRESS · COMMERCIAL SPATIAL FLOW & TERRACE SEATING LAYOUT</text>
    <text x="50" y="85" font-family="'Courier New', monospace" font-size="10" font-weight="bold" fill="#5F6F52" letter-spacing="1">LEVEL 01 · FINISHED FLOOR PLAN · SCALE 1:50 @ A3 · DIMENSIONS IN MM</text>
    <text x="50" y="100" font-family="'Courier New', monospace" font-size="9" fill="#7A7063">DWG NO: CAE-BLR-2024 · TOTAL AREA: 1,600 SQ.FT. CAFÉ & PATIO · MUSKAN PAREEK INTERIORS</text>
    <line x1="50" y1="110" x2="950" y2="110" stroke="#3D3A34" stroke-width="1.2" />
  </g>

  <!-- Flooring Textures & Zones -->
  <g id="flooringZones">
    
      <rect x="120" y="140" width="340" height="480" fill="url(#woodFloor)" opacity="0.7" />
      <text x="290" y="175" font-family="'Courier New', monospace" font-size="11" font-weight="bold" fill="#3D3A34" text-anchor="middle" letter-spacing="1">MAIN DINING & BOOTHS</text>
      <text x="290" y="189" font-family="'Courier New', monospace" font-size="8.5" fill="#6B6255" text-anchor="middle">5200 × 4600 mm</text>
    
    
      <rect x="480" y="140" width="400" height="480" fill="url(#tileGrid)" opacity="0.7" />
      <text x="680" y="175" font-family="'Courier New', monospace" font-size="11" font-weight="bold" fill="#3D3A34" text-anchor="middle" letter-spacing="1">ESPRESSO BAR & ORDERING</text>
      <text x="680" y="189" font-family="'Courier New', monospace" font-size="8.5" fill="#6B6255" text-anchor="middle">4800 × 3600 mm</text>
    
    
      <rect x="120" y="640" width="760" height="220" fill="url(#tileGrid)" opacity="0.7" />
      <text x="500" y="670" font-family="'Courier New', monospace" font-size="11" font-weight="bold" fill="#3D3A34" text-anchor="middle" letter-spacing="1">OUTDOOR TERRACE PATIO</text>
      <text x="500" y="684" font-family="'Courier New', monospace" font-size="8.5" fill="#6B6255" text-anchor="middle">8400 × 2600 mm</text>
    
  </g>

  <!-- Structural Walls with Hatch -->
  <g id="structuralWalls" filter="url(#wallShadow)">
    
      <rect x="100" y="120" width="800" height="18" fill="#2C2822" stroke="#1F1B16" stroke-width="1.5" />
      <rect x="100" y="120" width="800" height="18" fill="url(#brickHatch)" />
    
    
      <rect x="880" y="120" width="18" height="760" fill="#2C2822" stroke="#1F1B16" stroke-width="1.5" />
      <rect x="880" y="120" width="18" height="760" fill="url(#brickHatch)" />
    
    
      <rect x="100" y="880" width="800" height="18" fill="#2C2822" stroke="#1F1B16" stroke-width="1.5" />
      <rect x="100" y="880" width="800" height="18" fill="url(#brickHatch)" />
    
    
      <rect x="100" y="120" width="18" height="760" fill="#2C2822" stroke="#1F1B16" stroke-width="1.5" />
      <rect x="100" y="120" width="18" height="760" fill="url(#brickHatch)" />
    
    
      <rect x="460" y="120" width="16" height="500" fill="#2C2822" stroke="#1F1B16" stroke-width="1.5" />
      <rect x="460" y="120" width="16" height="500" fill="url(#brickHatch)" />
    
    
      <rect x="100" y="620" width="800" height="16" fill="#2C2822" stroke="#1F1B16" stroke-width="1.5" />
      <rect x="100" y="620" width="800" height="16" fill="url(#brickHatch)" />
    
  </g>

  <!-- Door Swings & Openings -->
  <g id="doorSwings">
    
  </g>

  <!-- Architectural Furniture Blocks -->
  <g id="furnitureLayout">
    <rect x="500" y="320" width="220" height="80" rx="8" fill="#C9A77D" stroke="#3D3A34" stroke-width="2" />
    <rect x="510" y="330" width="80" height="35" rx="3" fill="#1F2022" stroke="#3D3A34" stroke-width="1.5" />
    <rect x="610" y="330" width="90" height="35" rx="2" fill="#E5E1D8" stroke="#3D3A34" stroke-width="1.2" />
    <rect x="135" y="160" width="60" height="420" rx="6" fill="#ECE6DB" stroke="#3D3A34" stroke-width="1.5" />
    <rect x="210" y="200" width="55" height="45" rx="3" fill="#C9A77D" stroke="#3D3A34" stroke-width="1.2" />
    <rect x="210" y="320" width="55" height="45" rx="3" fill="#C9A77D" stroke="#3D3A34" stroke-width="1.2" />
    <rect x="210" y="440" width="55" height="45" rx="3" fill="#C9A77D" stroke="#3D3A34" stroke-width="1.2" />
    <circle cx="240" cy="740" r="28" fill="#D3CBC0" stroke="#3D3A34" stroke-width="1.5" />
    <circle cx="450" cy="740" r="28" fill="#D3CBC0" stroke="#3D3A34" stroke-width="1.5" />
    <circle cx="660" cy="740" r="28" fill="#D3CBC0" stroke="#3D3A34" stroke-width="1.5" />
    <circle cx="820" cy="740" r="28" fill="#D3CBC0" stroke="#3D3A34" stroke-width="1.5" />
  </g>

  <!-- Architectural Annotations & Dimension Chains -->
  <g id="annotations">
    <circle cx="520" cy="500" r="14" fill="#FFCF56" stroke="#2C2822" stroke-width="2" />
    <text x="520" y="504" font-family="'Courier New', monospace" font-size="10" font-weight="bold" fill="#2C2822" text-anchor="middle">01</text>
    <circle cx="450" cy="320" r="14" fill="#FFCF56" stroke="#2C2822" stroke-width="2" />
    <text x="450" y="324" font-family="'Courier New', monospace" font-size="10" font-weight="bold" fill="#2C2822" text-anchor="middle">02</text>
    <circle cx="220" cy="580" r="14" fill="#FFCF56" stroke="#2C2822" stroke-width="2" />
    <text x="220" y="584" font-family="'Courier New', monospace" font-size="10" font-weight="bold" fill="#2C2822" text-anchor="middle">03</text>
    <circle cx="650" cy="480" r="14" fill="#FFCF56" stroke="#2C2822" stroke-width="2" />
    <text x="650" y="484" font-family="'Courier New', monospace" font-size="10" font-weight="bold" fill="#2C2822" text-anchor="middle">04</text>
    <circle cx="820" cy="700" r="14" fill="#FFCF56" stroke="#2C2822" stroke-width="2" />
    <text x="820" y="704" font-family="'Courier New', monospace" font-size="10" font-weight="bold" fill="#2C2822" text-anchor="middle">05</text>
  </g>

  <!-- Graphic Scale Bar Bottom Right -->
  <g transform="translate(680, 935)">
    <rect x="0" y="0" width="240" height="20" fill="#FAF6EE" stroke="#3D3A34" stroke-width="1" />
    <rect x="0" y="0" width="60" height="10" fill="#3D3A34" />
    <rect x="60" y="10" width="60" height="10" fill="#3D3A34" />
    <rect x="120" y="0" width="60" height="10" fill="#3D3A34" />
    <rect x="180" y="10" width="60" height="10" fill="#3D3A34" />
    <text x="0" y="-4" font-family="'Courier New', monospace" font-size="8" fill="#3D3A34">0</text>
    <text x="60" y="-4" font-family="'Courier New', monospace" font-size="8" fill="#3D3A34">1m</text>
    <text x="120" y="-4" font-family="'Courier New', monospace" font-size="8" fill="#3D3A34">2m</text>
    <text x="180" y="-4" font-family="'Courier New', monospace" font-size="8" fill="#3D3A34">3m</text>
    <text x="240" y="-4" font-family="'Courier New', monospace" font-size="8" fill="#3D3A34">4m</text>
    <text x="120" y="28" font-family="'Courier New', monospace" font-size="8" fill="#7A7063" text-anchor="middle">METRIC GRAPHIC SCALE</text>
  </g>
</svg>