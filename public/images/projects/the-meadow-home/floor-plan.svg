  <!-- Title Block & Sheet Border -->
  <rect x="25" y="25" width="950" height="950" fill="none" stroke="#3D3A34" stroke-width="2.5" />
  <rect x="30" y="30" width="940" height="940" fill="none" stroke="#8C8275" stroke-width="0.75" />

  <!-- Sheet Title Block Header -->
  <g id="titleBlock">
    <!-- North Arrow -->
    <g transform="translate(910, 70)">
      <circle cx="0" cy="0" r="22" fill="#FAF6EE" stroke="#3D3A34" stroke-width="1.5" />
      <polygon points="0,-18 6,10 0,6" fill="#3D3A34" />
      <polygon points="0,-18 -6,10 0,6" fill="#8C8275" />
      <text x="0" y="-22" font-family="'Courier New', monospace" font-size="11" font-weight="bold" fill="#3D3A34" text-anchor="middle">N</text>
    </g>

    <!-- Project Header Text -->
    <text x="50" y="65" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="18" font-weight="bold" fill="#2C2822" letter-spacing="1.5">THE MEADOW HOME · MASTER SUITE & PRIVATE LOUNGE LAYOUT</text>
    <text x="50" y="85" font-family="'Courier New', monospace" font-size="10" font-weight="bold" fill="#5F6F52" letter-spacing="1">LEVEL 01 · FINISHED FLOOR PLAN · SCALE 1:50 @ A3 · DIMENSIONS IN MM</text>
    <text x="50" y="100" font-family="'Courier New', monospace" font-size="9" fill="#7A7063">DWG NO: MH-ALW-2024 · TOTAL AREA: 4,100 SQ.FT. VILLA SUITE · MUSKAN PAREEK INTERIORS</text>
    <line x1="50" y1="110" x2="950" y2="110" stroke="#3D3A34" stroke-width="1.2" />
  </g>

  <!-- Flooring Textures & Zones -->
  <g id="flooringZones">
    
      <rect x="140" y="150" width="460" height="420" fill="url(#woodFloor)" opacity="0.7" />
      <text x="370" y="185" font-family="'Courier New', monospace" font-size="11" font-weight="bold" fill="#3D3A34" text-anchor="middle" letter-spacing="1">MASTER SLEEPING SUITE</text>
      <text x="370" y="199" font-family="'Courier New', monospace" font-size="8.5" fill="#6B6255" text-anchor="middle">6500 × 5200 mm</text>
    
    
      <rect x="620" y="150" width="260" height="260" fill="url(#woodFloor)" opacity="0.7" />
      <text x="750" y="180" font-family="'Courier New', monospace" font-size="11" font-weight="bold" fill="#3D3A34" text-anchor="middle" letter-spacing="1">WALK-IN SYSTEM 32 WARDROBE</text>
      <text x="750" y="194" font-family="'Courier New', monospace" font-size="8.5" fill="#6B6255" text-anchor="middle">4200 × 3800 mm</text>
    
    
      <rect x="620" y="430" width="260" height="240" fill="url(#tileGrid)" opacity="0.7" />
      <text x="750" y="460" font-family="'Courier New', monospace" font-size="11" font-weight="bold" fill="#3D3A34" text-anchor="middle" letter-spacing="1">SPA EN-SUITE BATH</text>
      <text x="750" y="474" font-family="'Courier New', monospace" font-size="8.5" fill="#6B6255" text-anchor="middle">4200 × 3400 mm</text>
    
    
      <rect x="380" y="590" width="340" height="280" fill="url(#woodFloor)" opacity="0.7" />
      <text x="550" y="620" font-family="'Courier New', monospace" font-size="11" font-weight="bold" fill="#3D3A34" text-anchor="middle" letter-spacing="1">PRIVATE MORNING LOUNGE</text>
      <text x="550" y="634" font-family="'Courier New', monospace" font-size="8.5" fill="#6B6255" text-anchor="middle">5200 × 3600 mm</text>
    
    
      <rect x="140" y="720" width="220" height="180" fill="url(#tileGrid)" opacity="0.7" />
      <text x="250" y="750" font-family="'Courier New', monospace" font-size="11" font-weight="bold" fill="#3D3A34" text-anchor="middle" letter-spacing="1">GARDEN BALCONY TERRACE</text>
      <text x="250" y="764" font-family="'Courier New', monospace" font-size="8.5" fill="#6B6255" text-anchor="middle">8400 × 2200 mm</text>
    
  </g>

  <!-- Structural Walls with Hatch -->
  <g id="structuralWalls" filter="url(#wallShadow)">
    
      <rect x="120" y="130" width="780" height="18" fill="#2C2822" stroke="#1F1B16" stroke-width="1.5" />
