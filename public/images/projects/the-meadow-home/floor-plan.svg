    <ellipse cx="750" cy="530" rx="55" ry="32" fill="#FFFFFF" stroke="#3D3A34" stroke-width="1.5" />
    <rect x="640" y="600" width="140" height="35" rx="3" fill="#E5E1D8" stroke="#3D3A34" stroke-width="1.2" />
    <line x1="140" y1="710" x2="360" y2="710" stroke="#5F6F52" stroke-width="4" />
    <rect x="180" y="760" width="40" height="40" rx="4" fill="#D3CBC0" stroke="#3D3A34" stroke-width="1" />
    <circle cx="200" cy="740" r="10" fill="#ECE6DB" stroke="#3D3A34" stroke-width="1" />
    <circle cx="200" cy="820" r="10" fill="#ECE6DB" stroke="#3D3A34" stroke-width="1" />
  </g>

  <!-- Architectural Annotations & Dimension Chains -->
  <g id="annotations">
    <circle cx="300" cy="320" r="14" fill="#FFCF56" stroke="#2C2822" stroke-width="2" />
    <text x="300" y="324" font-family="'Courier New', monospace" font-size="10" font-weight="bold" fill="#2C2822" text-anchor="middle">01</text>
    <circle cx="520" cy="560" r="14" fill="#FFCF56" stroke="#2C2822" stroke-width="2" />
    <text x="520" y="564" font-family="'Courier New', monospace" font-size="10" font-weight="bold" fill="#2C2822" text-anchor="middle">02</text>
    <circle cx="700" cy="280" r="14" fill="#FFCF56" stroke="#2C2822" stroke-width="2" />
    <text x="700" y="284" font-family="'Courier New', monospace" font-size="10" font-weight="bold" fill="#2C2822" text-anchor="middle">03</text>
    <circle cx="560" cy="180" r="14" fill="#FFCF56" stroke="#2C2822" stroke-width="2" />
    <text x="560" y="184" font-family="'Courier New', monospace" font-size="10" font-weight="bold" fill="#2C2822" text-anchor="middle">04</text>
    <circle cx="350" cy="780" r="14" fill="#FFCF56" stroke="#2C2822" stroke-width="2" />
    <text x="350" y="784" font-family="'Courier New', monospace" font-size="10" font-weight="bold" fill="#2C2822" text-anchor="middle">05</text>
  </g>

  <!-- Graphic Scale Bar Bottom Right -->
  <g transform="translate(680, 935)">
    <rect x="0" y="0" width="240" height="20" fill="#FAF6EE" stroke="#3D3A34" stroke-width="1" />
    <rect x="0" y="0" width="60" height="10" fill="#3D3A34" />
    <rect x="60" y="10" width="60" height="10" fill="#3D3A34" />
    <rect x="120" y="0" width="60" height="10" fill="#3D3A34" />
    <rect x="180" y="10" width="60" height="10" fill="#3D3A34" />
    <text x="0" y="-4" font-family="'Courier New', monospace" font-size="8" fill="#3D3A34">0</text>
    <text x="60" y="-4" font-family="'Courier New', monospace" font-size="8" fill="#3D3A34">1m</text>
    <text x="120" y="-4" font-family="'Courier New', monospace" font-size="8" fill="#3D3A34">2m</text>
    <text x="180" y="-4" font-family="'Courier New', monospace" font-size="8" fill="#3D3A34">3m</text>
    <text x="240" y="-4" font-family="'Courier New', monospace" font-size="8" fill="#3D3A34">4m</text>
    <text x="120" y="28" font-family="'Courier New', monospace" font-size="8" fill="#7A7063" text-anchor="middle">METRIC GRAPHIC SCALE</text>
