<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
  <defs>
    <!-- Parchment Paper Filter & Hatching Patterns -->
    <pattern id="brickHatch" width="10" height="10" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#3D3A34" stroke-width="1.2" opacity="0.3" />
    </pattern>
    <pattern id="concreteHatch" width="8" height="8" patternTransform="rotate(-45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#5A5348" stroke-width="1.0" opacity="0.25" />
    </pattern>
    <pattern id="tileGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <rect width="24" height="24" fill="none" stroke="#D3CBC0" stroke-width="0.75" />
    </pattern>
    <pattern id="woodFloor" width="60" height="12" patternUnits="userSpaceOnUse">
      <rect width="60" height="12" fill="none" stroke="#D8CFC2" stroke-width="0.6" />
      <line x1="30" y1="0" x2="30" y2="12" stroke="#D8CFC2" stroke-width="0.6" />
    </pattern>
    <!-- Drop Shadow for Structure -->
    <filter id="wallShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#2D2820" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Parchment Sheet Background -->
  <rect width="100%" height="100%" fill="#FAF6EE" />
  
  <!-- Architectural Drawing Grid (Subtle 50mm Cad Grid) -->
  <g opacity="0.15">
    <line x1="50" y1="40" x2="50" y2="960" stroke="#B8AEA2" stroke-width="0.5" stroke-dasharray="2 4" />
    <line x1="100" y1="40" x2="100" y2="960" stroke="#B8AEA2" stroke-width="0.5" stroke-dasharray="2 4" />
    <line x1="150" y1="40" x2="150" y2="960" stroke="#B8AEA2" stroke-width="0.5" stroke-dasharray="2 4" />
    <line x1="200" y1="40" x2="200" y2="960" stroke="#B8AEA2" stroke-width="0.5" stroke-dasharray="2 4" />
    <line x1="250" y1="40" x2="250" y2="960" stroke="#B8AEA2" stroke-width="0.5" stroke-dasharray="2 4" />
