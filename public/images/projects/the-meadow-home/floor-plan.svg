      <rect x="120" y="880" width="780" height="18" fill="#2C2822" stroke="#1F1B16" stroke-width="1.5" />
      <rect x="120" y="880" width="780" height="18" fill="url(#brickHatch)" />
    
    
      <rect x="120" y="130" width="18" height="760" fill="#2C2822" stroke="#1F1B16" stroke-width="1.5" />
      <rect x="120" y="130" width="18" height="760" fill="url(#brickHatch)" />
    
    
      <rect x="600" y="130" width="16" height="540" fill="#2C2822" stroke="#1F1B16" stroke-width="1.5" />
      <rect x="600" y="130" width="16" height="540" fill="url(#brickHatch)" />
    
    
      <rect x="600" y="410" width="280" height="16" fill="#2C2822" stroke="#1F1B16" stroke-width="1.5" />
      <rect x="600" y="410" width="280" height="16" fill="url(#brickHatch)" />
    
    
      <rect x="360" y="570" width="256" height="16" fill="#2C2822" stroke="#1F1B16" stroke-width="1.5" />
      <rect x="360" y="570" width="256" height="16" fill="url(#brickHatch)" />
    
    
      <rect x="360" y="700" width="16" height="180" fill="#2C2822" stroke="#1F1B16" stroke-width="1.5" />
      <rect x="360" y="700" width="16" height="180" fill="url(#brickHatch)" />
    
  </g>

  <!-- Door Swings & Openings -->
  <g id="doorSwings">
    
      <!-- Door Opening: x=600, y=220 -->
      <line x1="600" y1="220" x2="600" y2="260" stroke="#3D3A34" stroke-width="2" />
      <path d="M 600,220 A 40,40 0 0,1 640,260" fill="none" stroke="#7A7063" stroke-width="1.2" stroke-dasharray="3 3" />
    
  </g>

  <!-- Architectural Furniture Blocks -->
  <g id="furnitureLayout">
    <rect x="220" y="240" width="180" height="200" rx="8" fill="#F4EFE6" stroke="#3D3A34" stroke-width="1.8" />
    <rect x="180" y="220" width="260" height="20" rx="2" fill="#784A30" stroke="#3D3A34" stroke-width="1.5" />
